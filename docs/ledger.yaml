    statement: "The launcher window is created hidden at startup, hidden by DwmSetWindowAttribute(DWMWA_CLOAK) and shown by moving it to the monitor under the cursor, uncloaking and applying the foreground trick; a hide driven by Esc or Enter also returns the foreground to the window recorded when the Launcher opened, unless the action launched a process, while a hide caused by focus loss only cloaks and never calls SetForegroundWindow, because the window the Owner just chose already has the keyboard; a named mutex Local\\NaobiCommand.Instance enforces one instance and a second launch posts one payload-free message to the first instance's message-only window; tray-ready means the tray icon is shown and the hotkeys are registered (within 300 ms of process start), the pre-created window is ready within 1.5 s of process start, a hotkey pressed earlier is queued and served as soon as the window is ready, and the app catalog loads asynchronously afterwards. Recorded in ADR-0005."

  - id: D-014
    type: decision
    version: 2
    status: active
    topic: 6
    answer: "autonomous default"
    recommendation: "One SQLite file in the local (non-roaming) profile with per-blob DPAPI encryption, as R-009 asks; search over clipboard text through an in-memory index dropped after 60 s idle."
    statement: "Clipboard entries, frecency and color history live in %LOCALAPPDATA%\\NaobiCommand\\naobi.db (SQLite, WAL); every content column is a CryptProtectData current-user blob and only metadata is plaintext; frecency stores a 64-bit xxh3 hash of the item identity keyed with a random per-install salt kept in the META table (a stable algorithm, never DefaultHasher), not the path; window restore rectangles, topmost windows and Awake mode are not persisted; schema changes are expand-contract with a file copy before migration. Recorded in ADR-0006."

  - id: D-015
    type: decision
    version: 3
    status: active
    topic: 6
