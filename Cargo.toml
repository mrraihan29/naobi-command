[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

# Pinned once here; each crate opts in with `x.workspace = true`.
# Other planned crates (slint, rusqlite, toml, ...) are added by the item that first uses them.
[workspace.dependencies]
windows = "0.62"
serde_json = "1"
anyhow = "1"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
slint-build = "1.18.1"
nucleo-matcher = "0.3.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
zeroize = "1"
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"
