  - id: R-012
    type: requirement
    version: 2
    status: active
    topic: 4
    answer: "aku percaya sama apa yang kamu buat! kamu tau standard kita dan prioritas kita! jadi lakukan yang terbaik. aku gak menggunakan bitwarden, pake nya proton pass"
    recommendation: "Owner accepted: exact alias first, then fuzzy title score with a frecency boost of at most 20% of the fuzzy score, files as a trailing section because Windows Search results arrive last, and Esc hides a view that was opened directly by its own hotkey."
    statement: "(critical) As the owner, I type into one root search that mixes apps, files, commands, quicklinks and calculator results, ranked exact alias first, then fuzzy title match with a frecency boost of at most 20% of the fuzzy score, with file results in a trailing section because Windows Search results arrive last; Enter runs the primary action, Ctrl+Enter the secondary action, Ctrl+K opens the action panel, and Esc clears the query, then pops the view, then hides the launcher; a view opened directly by its own hotkey (for example clipboard history via Alt+Shift+V) hides on Esc instead of popping to the root view."
    acceptance:
      - "Typing an exact alias ranks its item first"
      - "An item opened more often ranks above an equal fuzzy match; frecency never raises an item by more than 20% of its fuzzy score"
      - "Enter on an app result launches it and hides the launcher"
      - "Ctrl+K lists the selected result's actions"
      - "Esc with a non-empty query clears it; Esc on an empty root view hides the launcher"
      - "Esc on an empty query in a view opened by its own hotkey hides the launcher"
      - "File results appear after the other results"
    links:
      tickets: ["NCMD-14@2", "NCMD-15@2", "NCMD-16@2", "NCMD-17@2"]

