    answer: "Request (2026-11-14): \"coba kamu lihat menu powertoys ini deh, ada fungsi > yang dimana kalo misal aku ketik >ping google.com -t berarti akan membuka terminal dan menjalankan ping google.com -t. terus kalo misal aku ketik > doang maka akan ada history command apa aja yang pernah aku jalankan! ini fitur yang sangat berguna! selain itu bisa gak fitur fitur seperti color picker juga bisa dipanggil lewat search ga harus mencet shortcut\". Answers: rule change (command lines from queries, R-010 exception for the Owner's own processes) = \"Setuju\"; history storage = \"Terenkripsi DPAPI, 100 entri, 30 hari\"; terminal = \"windows powershell 7.1\" (the machine has PowerShell 7.7 as pwsh; fallback Windows PowerShell 5.1). Architect change accepted: -EncodedCommand instead of -Command (quote-exact)."
    recommendation: "Run the typed line through pwsh -NoExit -EncodedCommand in a new console, start GUI programs directly, keep a DPAPI run history of 100 lines and 30 days, and add search keywords for the module commands."
    statement: "The Launcher runs a command line the Owner types after '>': PowerShell 7 (pwsh.exe, found through PATH or App Paths) with -NoExit -EncodedCommand (base64 of the UTF-16LE line, so the Owner's characters reach PowerShell unchanged) in a new console window started with the shell 'open' verb in %USERPROFILE%, outside the app's kill-on-close job; Windows PowerShell 5.1 when pwsh is not found; a first token that resolves to a readable PE image with the WINDOWS_GUI subsystem is started directly with the rest of the line as arguments, and a failed lookup falls back to the console; lookups run on Enter only and never touch a UNC or remote-drive path; the run history is the V2 table run_history (line_enc and program_enc DPAPI current-user blobs, last_run_at), at most 100 lines and 30 days, decrypted only while a '>' query is shown, deletable one by one, never logged; run rows are not armed (R-020 does not cover them), not counted in frecency, and carry no command text in item ids or icon keys; a process the Owner starts with '>' is the Owner's process, so R-010's no-socket rule covers the app and its own children and the network-silence session does not use '>'; module commands get search keywords in code, with no alias setting."
    links:
      decisions: ["D-014@2", "D-020@1", "D-024@1"]
