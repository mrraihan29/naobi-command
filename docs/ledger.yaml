# Decision ledger for Naobi Command. Schema: C:/Coding/naobi-sdlc/references/ledger.md
schema_version: 1
project: naobi-command
test_globs:
  - "crates/**/*.rs"
  - "tests/**/*.rs"
na_topics:
  9: "No external integrations in the MVP: the product is offline-only; currency rates are phase 2."
entries:
  - id: R-001
    type: requirement
    version: 1
    status: active
    topic: 1
    answer: "setuju dengan semuanya!"
    recommendation: "Pengguna: kamu sendiri (single user, power user Windows 11). Masalah: Raycast + PowerToys adalah dua aplikasi terpisah, berat di RAM, dan fiturnya tidak pas dengan kebutuhanmu. Tidak didistribusikan ke publik."
    statement: "Naobi Command is a personal tool for one Windows 11 power user (the owner) that replaces two separate, memory-heavy tools (Raycast and PowerToys) with one tailored app; it is not distributed publicly."
    acceptance:
      - "The app runs for a single local user with no account and no multi-user features"
    links:
      tickets: ["NCMD-5@1"]

  - id: R-002
    type: requirement
    version: 1
    status: active
    topic: 2
    answer: "setuju dengan semuanya!"
    recommendation: "Sukses = PowerToys bisa di-uninstall dan Raycast tidak dibutuhkan selama 14 hari pemakaian harian, tanpa satu pun fitur MVP yang membuatmu kembali ke aplikasi lama; plus semua budget performa di Q8 lolos."
    statement: "Success means the owner uses Naobi Command daily for 14 days with PowerToys uninstalled and Raycast not installed, without falling back to either for any MVP capability, and every performance budget in R-006 passes."
    acceptance:
      - "A 14-day usage log records zero fallbacks to PowerToys or Raycast for MVP capabilities"
      - "perf-harness reports every R-006 budget as PASS"
    links:
      tickets: ["NCMD-6@1", "NCMD-25@1", "NCMD-26@1"]

  - id: R-003
    type: requirement
    version: 1
    status: active
    topic: 3
    answer: "setuju dengan semuanya!"
    recommendation: "Windows 11 x64 saja. macOS/Linux out of scope."
    statement: "The only supported platform is Windows 11 on x86_64; macOS and Linux are out of scope."
    acceptance:
      - "The release build targets x86_64-pc-windows-msvc only"
    links:
      tickets: ["NCMD-4@1"]

  - id: R-004
    type: requirement
    version: 1
    status: active
    topic: 3
    answer: "setuju dengan semuanya!"
    recommendation: "MVP = A (Launcher: app, file, system commands, quicklinks web search), B (kalkulator + konversi unit), C (Clipboard history), E (Window management snap/zona), F (Color Picker), G (Always On Top), H (Awake). Fase 2 = D (Snippets), I (Text Extractor OCR), J (Keyboard remapper), K (PowerRename, Image Resizer, Hosts editor, Peek, emoji picker, dll)."
    statement: "The MVP contains seven modules: launcher (apps, files, system commands, web-search quicklinks), inline calculator with unit conversion, clipboard history, window management (snap to zones), color picker, always-on-top, and awake. Snippets, OCR text extractor, keyboard remapper and the remaining PowerToys utilities are phase 2."
    acceptance:
      - "Each of the seven MVP modules is reachable from the launcher or its own hotkey"
      - "No phase-2 module ships in the MVP build"
    links:
      tickets: ["NCMD-25@1", "NCMD-35@1"]

  - id: R-005
    type: requirement
    version: 1
    status: active
    topic: 3
    answer: "setuju dengan semuanya!"
    recommendation: "Tidak kompatibel dengan extension Raycast (JS/React); tidak ada plugin system di MVP (semua modul built-in Rust); fitur AI di luar MVP (nanti bisa via Ollama lokal)."
    statement: "Out of scope for the MVP: Raycast extension compatibility, any third-party plugin system, and AI features; all modules are built into the Rust binary."
    acceptance:
      - "The MVP build loads no external plugin code and makes no AI calls"
    links:
      tickets: ["NCMD-4@1", "NCMD-25@1"]

  - id: R-006
    type: requirement
    version: 5
    status: active
    topic: 5
    answer: "A + C together."
    recommendation: "RK-15 verdict 6b (keystroke p95_est 19.3 ms, p95_upper 26.3 ms on screen at 144 Hz under ~48% background CPU). Change the keystroke budget to p95 <= 25 ms measured on screen including DWM composition under normal load (about 3 frames at 144 Hz), and add a parity target: Naobi keystroke inject_to_t1 p95 is no worse than PowerToys Command Palette measured the same way (NCMD-6)."
    statement: "Performance budgets: hotkey-to-visible p95 <= 50 ms; keystroke-to-results p95_est (p95_upper minus the measured probe cost) <= 25 ms over a 10,000-item index, from the key event received by the window procedure to the composed on-screen frame that contains the new results, measured under normal background load (D-036), and keystroke inject-to-screen p95 no worse than PowerToys Command Palette measured the same way; idle working set <= 40 MB total, measured without working-set trimming; idle CPU < 0.5% averaged over 60 s; process start to tray-ready (tray icon shown, hotkeys registered) <= 300 ms, pre-warmed launcher window ready <= 1.5 s after process start, and a hotkey pressed before the window is ready is served as soon as it is; release exe <= 20 MB. The installed PowerToys is measured as the baseline."
    acceptance:
      - "perf-harness measures hotkey-to-visible p95 <= 50 ms over 200 runs"
      - "perf-harness measures keystroke-to-results p95_est (p95_upper minus the measured probe cost) <= 25 ms over a 10,000-item index, from the key event received by the window procedure to the composed on-screen frame that contains the new results"
      - "Naobi keystroke inject_to_t1 p95 is no worse than PowerToys Command Palette inject_to_t1 p95 in the NCMD-6 baseline"
      - "Idle working set <= 40 MB and idle CPU < 0.5% over 60 s, measured without working-set trimming"
      - "Process start to tray-ready <= 300 ms and launcher window ready <= 1.5 s after process start; a hotkey pressed before the window is ready opens the launcher as soon as it is ready; release exe size <= 20 MB"
      - "A baseline report records the same metrics for the installed PowerToys"
    links:
      tickets: ["NCMD-4@5", "NCMD-5@5", "NCMD-6@5", "NCMD-11@5", "NCMD-14@5", "NCMD-25@5", "NCMD-27@5"]

  - id: R-007
    type: requirement
    version: 1
    status: active
    topic: 10
    answer: "setuju dengan semuanya!"
    recommendation: "Token dari naobi.dev/DESIGN.md (tema terang 'paper', tema gelap 'stone', ikut tema Windows), font Inter + JetBrains Mono di-embed, bahasa UI Inggris, WCAG 2.2 AA untuk kontras, semua fitur bisa pakai keyboard saja."
    statement: "The UI applies the Naobi design tokens from naobi.dev DESIGN.md with a light 'paper' theme and a dark 'stone' theme that follow the Windows app theme, embeds Inter and JetBrains Mono, uses English copy, meets WCAG 2.2 AA contrast, and every capability is operable by keyboard alone."
    acceptance:
      - "Switching Windows between light and dark mode switches the app theme without restart"
      - "All text/background token pairs meet WCAG 2.2 AA contrast ratios"
      - "Every MVP capability can be completed without a mouse"
    links:
      tickets: ["NCMD-11@1", "NCMD-13@1", "NCMD-25@1"]

  - id: R-008
    type: requirement
    version: 1
    status: active
    topic: 4
    answer: "setuju dengan semuanya!"
    recommendation: "Alt+Space untuk launcher; PowerToys Run/CmdPal dimatikan saat migrasi supaya tidak bentrok."
    statement: "As the owner, I press Alt+Space anywhere to open the launcher so that every capability starts from one hotkey; if the hotkey is already registered, the app reports the conflict instead of failing silently."
    acceptance:
      - "Alt+Space opens the launcher from any foreground app"
      - "When Alt+Space is taken by another process, a visible conflict notice names the hotkey"
    links:
      tickets: ["NCMD-12@1", "NCMD-13@1"]

  - id: R-009
    type: requirement
    version: 1
    status: active
    topic: 6
    answer: "setuju dengan semuanya!"
    recommendation: "Semua data lokal: settings TOML di %APPDATA%\\NaobiCommand, clipboard history di SQLite dengan isi dienkripsi Windows DPAPI, retensi 30 hari / 1.000 item, clipboard dari password manager (Bitwarden) diabaikan lewat format eksklusi standar Windows, ada perintah 'Clear clipboard history'. UU PDP tidak relevan (data milik sendiri, di perangkat sendiri)."
    statement: "All data stays local: settings as TOML in %APPDATA%\\NaobiCommand, clipboard history in SQLite with entry contents encrypted by Windows DPAPI (current user), retained for at most 30 days or 1,000 entries; clipboard updates flagged with ExcludeClipboardContentFromMonitorProcessing or CanIncludeInClipboardHistory=0 are never stored; a 'Clear clipboard history' command deletes all entries. UU 27/2022 does not apply because the owner processes only their own data on their own device."
    acceptance:
      - "Clipboard entry contents in the SQLite file are not readable as plaintext"
      - "Entries older than 30 days or beyond 1,000 are purged"
      - "A copy flagged with ExcludeClipboardContentFromMonitorProcessing is not stored"
      - "Clear clipboard history leaves zero entries"
    links:
      tickets: ["NCMD-8@1", "NCMD-9@1", "NCMD-19@1", "NCMD-20@1"]

  - id: R-010
    type: requirement
    version: 2
    status: active
    topic: 7
    answer: "setuju dengan semuanya!"
    recommendation: "Tanpa login/akun; tidak ada koneksi keluar kecuali aksi eksplisit (buka URL di browser); jalan sebagai user biasa; modul yang butuh admin (fase 2, mis. Hosts editor) lewat helper terpisah yang minta elevasi hanya saat dipakai; OWASP ASVS 5.0 Level 1 untuk bab yang relevan + threat model STRIDE."
    statement: "The app has no accounts, runs at medium integrity as the signed-in user, makes no outbound network connection except when the owner explicitly opens a URL (a program the owner starts with a '>' command line is the owner's own process, not the app's), and any phase-2 module needing admin rights runs in a separate helper elevated on demand. Security bar: OWASP ASVS 5.0 Level 1 where applicable, plus a STRIDE threat model."
    acceptance:
      - "The main process token is not elevated"
      - "No socket is opened by the app or its own child processes during a 10-minute idle-and-use session without an explicit URL action; the session runs no '>' command line"
      - "STRIDE threats in the design report each have a mitigation, test or accepted risk"
    links:
      tickets: ["NCMD-5@2", "NCMD-17@2", "NCMD-25@2", "NCMD-36@2"]

  - id: D-001
    type: decision
    version: 1
    status: active
    topic: 8
    answer: "setuju dengan semuanya!"
    recommendation: "Full Rust, tanpa Tauri (WebView2 +60-100 MB RAM melanggar budget Q8)."
    statement: "The whole product is Rust with a native (non-webview) UI; Tauri/WebView2 is rejected because its +60-100 MB working set breaks the 40 MB idle budget in R-006, and Rust is justified by the measured budgets in R-006 plus low-level Win32 hooks."

  - id: D-002
    type: decision
    version: 1
    status: superseded
    superseded_by: D-034
    topic: 8
    answer: "setuju dengan semuanya!"
    recommendation: "Slint vs GPUI ditunda ke prototipe: bangun launcher minimal di keduanya, ukur terhadap Q8 dan kesetiaan visual Naobi."
    statement: "The native UI framework (Slint or GPUI) is chosen by a prototype that builds the same minimal launcher in both and measures them against R-006 and Naobi visual fidelity."

  - id: D-003
    type: decision
    version: 1
    status: active
    topic: 8
    answer: "setuju dengan semuanya!"
    recommendation: "Aku install rustup (stable, MSVC) dan cek Visual Studio Build Tools sebelum prototipe UI."
    statement: "The toolchain is rustup stable with the x86_64-pc-windows-msvc host; it is installed before the UI prototype."

  - id: D-004
    type: decision
    version: 1
    status: active
    topic: 3
    answer: "setuju dengan semuanya!"
    recommendation: "PowerToys: baca source + dokumentasi resmi (MIT), tanpa REA. Raycast: izin download installer Raycast for Windows dari raycast.com, dianalisis dengan REA untuk inventaris fitur/perilaku/UX secara clean-room. Hasil ke docs/research/ sebagai input Design."
    statement: "Reference research is clean-room: PowerToys behaviour comes from its MIT source and official docs; Raycast for Windows behaviour comes from its official docs plus REA analysis of the installed app; outputs are feature and behaviour notes in docs/research/, and no third-party code, assets or proprietary text are copied into the product."

  - id: D-005
    type: decision
    version: 1
    status: active
    topic: 11
    answer: "setuju dengan semuanya!"
    recommendation: "Cargo workspace, satu crate per modul (core, launcher, clipboard, winmgr, ui, ...); rustfmt + clippy -D warnings; thiserror di library, anyhow di binary; tanpa unwrap() di luar test; unsafe hanya di adapter Win32 dengan komentar // SAFETY:."
    statement: "Code layout is a Cargo workspace with one crate per module; rustfmt and clippy with -D warnings gate every change; libraries use thiserror and the binary uses anyhow; unwrap/expect are forbidden outside tests; unsafe code lives only in Win32 adapter modules and every unsafe block carries a // SAFETY: comment."

  - id: D-006
    type: decision
    version: 1
    status: active
    topic: 12
    answer: "setuju dengan semuanya!"
    recommendation: "Playwright tidak berlaku (app native). cargo test untuk logika tiap crate (ranking pencarian, parser kalkulator, retensi clipboard, layout zona), integration test per modul, plus binary perf-harness untuk budget Q8. Alur kritis: hotkey -> buka app, copy -> cari -> paste dari history, snap window."
    statement: "Playwright does not apply to this native app. Logic is tested with cargo test per crate (search ranking, calculator parser, clipboard retention, zone layout), each module has integration tests, and a perf-harness binary verifies R-006. Critical flows: hotkey to app launch, copy to search to paste from history, window snap."

  - id: D-007
    type: decision
    version: 1
    status: active
    topic: 13
    answer: "setuju dengan semuanya!"
    recommendation: "Exe portable hasil build release + autostart via registry HKCU Run. Installer (MSIX/winget) dan auto-update di luar MVP. Tanpa server, tanpa backup."
    statement: "Delivery is a portable release exe with optional autostart through HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run; installers and auto-update are out of the MVP; there is no server and no backup."

  - id: D-008
    type: decision
    version: 1
    status: active
    topic: 14
    answer: "setuju dengan semuanya!"
    recommendation: "Budget Rp0, tidak ada deadline keras, pemutus keputusan tunggal: kamu."
    statement: "Budget is zero (only free and open-source dependencies), there is no hard deadline, and the owner is the single decider."

