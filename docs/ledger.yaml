    recommendation: "Owner confirmed: pinned entries are exempt from the 30-day and 1,000-entry limit, capped at 100, and removed by Clear clipboard history."
    statement: "Clipboard limits: a text entry over 1 MiB is not stored; an image is stored only if its PNG is at most 10 MB and a raw bitmap over 64 MiB is rejected before conversion; a file list keeps at most 1,000 paths; the store is capped at 500 MB with the oldest unpinned entries evicted first; captures are rate-limited to 10 per second with trailing-edge capture, so the last clipboard state after a burst is always stored; pinned entries (at most 100) survive the retention purge (R-015) but are deleted by Clear clipboard history (R-009); settings may lower the 30-day and 1,000-entry retention but never raise it."

