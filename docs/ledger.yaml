    statement: "File results in the MVP come from querying the Windows Search system index; the app keeps no file index of its own. An own NTFS index is phase 2."
    acceptance:
      - "A file in an indexed location appears in results by name"
      - "When Windows Search is disabled, the launcher shows a 'file search unavailable' row instead of an error"
    links:
