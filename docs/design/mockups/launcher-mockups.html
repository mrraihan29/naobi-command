<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naobi Command mockups</title>
<!-- Approved mockup direction (ledger: mockup approval D- entry). Tokens: docs/design/DESIGN_SYSTEM.md. Rendered at 85% of 750x475. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
body{margin:0;padding:24px 16px;background:#ece8de;font-family:Inter,sans-serif;color:#171714}
h1{font-size:18px;font-weight:500;margin:0 0 4px}p.lead{margin:0 0 20px;font-size:13px;color:#6d6a63}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,660px),1fr));gap:24px}
figure{margin:0}figcaption{font-size:12px;color:#6d6a63;margin:0 0 6px;font-family:'JetBrains Mono',monospace}
.nc{font-family:Inter,sans-serif;width:640px;max-width:100%;height:405px;border-radius:7px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--ln);background:var(--win);color:var(--t1)}
.nc .hd{height:56px;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid var(--ln);font-size:14px}
.nc .ls{flex:1;padding:6px;overflow:hidden}.nc .sec{font-size:11px;font-weight:500;letter-spacing:.025em;color:var(--mu);padding:6px 8px 4px}
.nc .row{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:2px;font-size:12px;border-left:2px solid transparent}
.nc .row.sel{background:var(--sel);border-left-color:var(--ac)}
.nc .ic{width:19px;height:19px;border-radius:4px;background:var(--rs);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t2)}
.nc .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu)}.nc .row.sel .sub{color:var(--t2)}
.nc .ch{font-family:Inter;font-size:11px;font-weight:500;border:1px solid var(--ls);border-radius:2px;padding:1px 5px;color:var(--t2)}
.nc .ft{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--rs);border-top:1px solid var(--ln);font-size:11px;font-weight:500;letter-spacing:.025em;color:var(--mu)}
.nc mark{background:none;color:var(--ac);font-weight:500}
</style>
</head>
<body>
<h1>Naobi Command: approved mockup direction</h1>
<p class="lead">Five key screens in the paper and stone themes. Remaining screens follow the same pattern and are specified per ticket.</p>
<div class="grid" id="g"></div>
<script>
const T={paper:{win:'#FAF8F2',rs:'#F3F0E8',sel:'#E8E6E0',t1:'#171714',t2:'#393732',mu:'#6D6A63',ac:'#914A3B',ln:'#D9D3C7',ls:'#C7C1B6',fo:'#275D9A',well:'#F3F0E8'},
stone:{win:'#2A2622',rs:'#36312C',sel:'#3A3632',t1:'#F3F0E8',t2:'#F3F0E8',mu:'rgba(243,240,232,.58)',ac:'#E3BDA9',ln:'#4A433A',ls:'#5A5249',fo:'#E3BDA9',well:'#0D0B09'}};
const r=(i,t,s,k,sel)=>`<div class="row${sel?' sel':''}"><div class="ic"><i class="ti ti-${i}" aria-hidden="true"></i></div><span>${t}</span><span class="sub">${s||''}</span><span style="flex:1"></span>${k?`<span class="ch">${k}</span>`:''}</div>`;
const sec=t=>`<div class="sec">${t}</div>`;
const hd=(q,ph)=>`<div class="hd"><i class="ti ti-search" style="color:var(--mu);font-size:16px" aria-hidden="true"></i><span style="${q?'':'color:var(--mu)'}">${q||ph}</span>${q?'<span style="width:1px;height:16px;background:var(--t1)"></span>':''}</div>`;
const ft=(l,rr)=>`<div class="ft"><span>${l}</span><span style="display:flex;gap:10px;align-items:center">${rr}</span></div>`;
const ftD=ft('Naobi Command','Open <span class="ch">Enter</span> Actions <span class="ch">Ctrl K</span>');
const S={
'1 launcher root':()=>hd('','Search apps, files and commands')+`<div class="ls">${sec('Recent')}${r('brand-vscode','Visual Studio Code','Application','',1)}${r('terminal-2','Windows Terminal','Application')}${r('clipboard','Clipboard History','Command','Alt Shift V')}${r('layout-sidebar','Left Half','Window','Ctrl Alt ←')}${r('color-picker','Pick Color','Command','Win Shift C')}${sec('Quicklinks')}${r('brand-github','Search GitHub','gh {query}')}${r('world','naobi.dev','nb')}</div>`+ftD,
'2 results with calculator':()=>hd('2^10 + 15%')+`<div class="ls">${sec('Calculator')}<div class="row sel" style="height:60px;justify-content:space-between;padding:0 12px"><span class="sub" style="font-size:13px">2^10 + 15%</span><i class="ti ti-arrow-right" style="color:var(--mu)" aria-hidden="true"></i><span style="font-size:18px;font-weight:500">1,177.6</span></div>${sec('Results')}${r('brand-github','<mark>G</mark>it<mark>H</mark>ub search','Quicklink · gh')}${r('settings','Open Windows Settings','System')}${sec('Files')}${r('file-text','budget-2026.xlsx','D:\\Docs\\finance')}</div>`+ft('Naobi Command','Copy result <span class="ch">Enter</span>'),
'3 action panel':()=>hd('code')+`<div class="ls" style="position:relative">${sec('Results')}${r('brand-vscode','Visual Studio <mark>Code</mark>','Application','',1)}${r('folder','<mark>Code</mark>','C:\\Coding')}${r('file-code','<mark>code</mark>-review.md','Documents')}<div style="position:absolute;right:10px;bottom:6px;width:260px;background:var(--rs);border:1px solid var(--ln);border-radius:4px;padding:6px"><div style="height:28px;border:2px solid var(--fo);border-radius:2px;display:flex;align-items:center;padding:0 8px;font-size:12px;color:var(--mu);margin-bottom:6px">Filter actions</div>${r('player-play','Open','','Enter',1)}${r('shield','Run as administrator','','Ctrl Enter')}${r('folder-open','Show in Explorer','','Ctrl O')}${r('copy','Copy path','','Ctrl C')}${r('pin','Add alias','','')}</div></div>`+ftD,
'4 clipboard history':()=>hd('','Search clipboard history')+`<div style="flex:1;display:flex;overflow:hidden"><div class="ls" style="flex:0 0 44%;border-right:1px solid var(--ln)">${sec('Pinned')}${r('pin','ssh naobi@core…','Text · 32 chars')}${sec('Today')}${r('photo','Screenshot 1440×900','Image · 412 KB','',1)}${r('align-left','Rust ownership notes','Text · 1.2 KB')}${r('files','3 files','File list')}${r('link','naobi.dev/learn','Link')}</div><div style="flex:1;padding:12px;display:flex;flex-direction:column;gap:10px"><div style="flex:1;background:var(--well);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mu)"><i class="ti ti-photo" style="font-size:40px" aria-hidden="true"></i></div><div class="sub" style="line-height:1.7">Copied from Snipping Tool · 21:42<br>1440 × 900 · PNG · 412 KB</div></div></div>`+ft('Clipboard History','Paste <span class="ch">Enter</span> Copy <span class="ch">Ctrl Enter</span> Pin <span class="ch">Ctrl P</span>'),
'5 window management':()=>hd('half')+`<div class="ls"><div style="margin:2px 6px 6px;padding:7px 10px;border-left:2px solid var(--ac);background:var(--rs);font-size:12px;color:var(--t2)">Can't move Task Manager: it runs as administrator.</div>${sec('Window')}${r('layout-sidebar','Left <mark>Half</mark>','','Ctrl Alt ←',1)}${r('layout-sidebar-right','Right <mark>Half</mark>','','Ctrl Alt →')}${r('layout-navbar','Top <mark>Half</mark>','','Ctrl Alt ↑')}${r('layout-bottombar','Bottom <mark>Half</mark>','','Ctrl Alt ↓')}${r('arrows-maximize','Almost Maximize','','')}${r('device-desktop','Next Display','','')}</div>`+ftD};
const g=document.getElementById('g');
for(const name in S)for(const th of ['paper','stone']){const f=document.createElement('figure');f.innerHTML=`<figcaption>${name} · ${th}</figcaption><div class="nc"></div>`;const m=f.querySelector('.nc');for(const k in T[th])m.style.setProperty('--'+k,T[th][k]);m.innerHTML=S[name]();g.appendChild(f);}
</script>
</body>
</html>
