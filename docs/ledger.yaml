    answer: "autonomous default"
    recommendation: "Isolate the UI framework behind one seam so D-002 can be decided by the prototype without touching any other crate; keep focus-free overlays, the tray menu and notices outside the framework."
    statement: "The UI framework is isolated: naobi-core::ui defines the ViewModel and UiEvent data types and the launcher returns Effects, so behaviour is testable without a window; only the naobi-ui crate depends on Slint and naobi-app calls naobi-ui directly (no UiShell trait, since D-034 resolved the framework); the color picker overlay, the topmost border, the tray menu and notices are native Win32 owned by naobi-win32. Recorded in ADR-0002."

