    statement: "Root search ranks in two tiers: an exact alias match first; then every other Result by nucleo-matcher fuzzy score on title and keywords plus a frecency boost of min(5 x decayed open count, 20% of the fuzzy score) points with a 30-day half-life, ties broken by title; a minimum fuzzy score filters weak matches (tuned in Build on the 10,000-item set); at most 50 rows are shown; an empty query lists the 10 most frecent Items; file results arrive asynchronously from Windows Search, are capped at 30, form a trailing Files section ordered by Windows Search rank, and never move rows above them."

  - id: D-017
    type: decision
    version: 2
    status: active
    topic: 4
    answer: "autonomous default"
    recommendation: "Pick the percent semantics that match the owner's example '2^10 + 15%' and the reference calculators, keep arithmetic in f64, and show no calculator row for bare numbers."
    statement: "Calculator semantics: arithmetic uses f64 and prints 10 significant digits with trailing zeros trimmed; operators are + - * / ^ and parentheses, mod is the word 'mod'; percent means a + b% = a + a*b/100, a - b% likewise, a * b% = a*b/100 and a lone b% = b/100, so '2^10 + 15%' = 1177.6; 0x and 0b literals are accepted and 'to hex' or 'to bin' prints an integer in that base using i128 integer math, exact above 2^53; unit conversion is '<number> <unit> to|in <unit>' inside one of the eight categories with case-insensitive names and affine temperature; in the data size category KB, MB, GB and TB are powers of 1000 and KiB, MiB, GiB and TiB are powers of 1024; a bare number or a word shows no calculator row; division by zero shows no result; Enter copies the result text."

